[project]
name = "pnc-diag-mcp"
version = "0.1.0"
description = "Open-source thin interface, zero-deserialization bag inspector, Agent Skill, and synthetic example kit for autonomous driving PNC and LiDAR-SLAM telemetry."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
authors = [
    { name = "VictorLiu0725", email = "albertlw007@gmail.com" },
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "mcap>=1.1.1",
    "mcp>=2.0.0",
    "numpy>=1.26.0",
    "pyyaml>=6.0.1",
    "rosbags>=0.10.0",
]

[project.scripts]
pnc-diag = "pnc_diag.cli:main"
pnc-diag-mcp = "pnc_diag.mcp_server:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pnc_diag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py310"
